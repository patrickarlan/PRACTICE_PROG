<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* MOBILE-FIRST CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
        }

        .app-layout {
            display: grid;
            min-height: 100vh;
            gap: 10px;

            grid-template-columns: 1fr;
            grid-template-rows: auto auto 1fr auto;
            grid-template-areas:
                "header"
                "sidebar"
                "content"
                "footer";
        }

        .app-header {
            grid-area: header;
            background: #5e90c8;
            padding: 24px 32px;
            color: white;
        }

        .app-sidebar {
            grid-area: sidebar;
            background: #d4d8e3;
            padding: 24px 16px;
        }

        .app-content {
            grid-area: content;
            padding: 32px;
        }

        .app-footer {
            grid-area: footer;
            background: #2c3e50;
            color: white;
            padding: 16px 32px;
        }

        @media (min-width:768px) {
            .app-layout {
                grid-template-columns: 250px 1fr;
                grid-template-rows: auto 1fr auto;
                grid-template-areas:
                    "header header"
                    "sidebar content"
                    "footer footer";
            }
        }
    </style>
    <title>GRID</title>
</head>

<body>
    <div class="app-layout">
        <header class="app-header">HRIS System</header>
        <aside class="app-sidebar">HRIS Sidebar</aside>
        <main class="app-content">HRIS Content</main>
        <footer class="app-footer">@2026 HRIS</footer>
    </div>
</body>

</html>
