<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        main {
            padding: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            width: 100%;
            bottom: 0;
        }

        /* login form */
        .login-form,
        .regist-form {
            display: block;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            padding-right: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .h1 {
            display: block;
            text-align: center;
            margin: 15px auto 0;
        }


        .label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }



        button {
            display: block;
            width: 50%;
            padding: 10px;
            margin: 15px auto 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }

        /* registration form */
        #regLabelPos {
            margin-top: 15px;
            display: block;

        }

        input[type="checkbox"] {
            width: auto;
            display: inline;
            margin-right: 8px;
            margin-bottom: 15px;
            padding: 0;
        }

        label[for="terms"] {
            display: inline;
        }

        .radioRoles {
            display: block;
            margin: auto;
            text-align: center;
        }

        input[type="radio"] {
            width: auto;
            display: inline;
            margin-right: 5px;
        }

        label[for="employee"],
        label[for="admin"] {
            display: inline;
            margin-right: 5px;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-bottom: auto;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <header>
        <h1>Login and Registration Forms</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="table.html">Table</a>
            <a href="login_registration.html">Login/Register</a>
        </nav>
    </header>
    <main>
        <form action="/api/login" method="POST">
            <!-- login form -->
            <section class="login-form">
                <h2 class="h1">Login</h2>
                <label for="logEmail">Email:</label>
                <input type="email" id="logEmail" name="userEmail" required placeholder="you@example.com">
                <label for="logPassw">Password:</label>
                <input type="password" id="logPassw" name="userPasswords" required placeholder="Enter your password">
                <button type="submit">Login</button>
            </section>
        </form>

        <form action="/api/register" method="POST">
            <!-- registration form -->
            <section class="regist-form">
                <h2 class="h1">Register</h2>
                <label for="regFullName">Full Name:</label>
                <input type="text" id="regFullName" name="fullName" required placeholder="Full name">
                <label for="regEmail">Email:</label>
                <input type="email" id="regEmail" name="userEmail" required placeholder="you@example.com">
                <label for="regPassw">Password:</label>
                <input type="password" id="regPassw" name="userPasswords" required placeholder="Enter your password">

                <label for="department">Department:</label>
                <select id="department" name="regDepartment">
                    <option value="" disabled selected>Select your department</option>
                    <option value="ENG">Engineering</option>
                    <option value="SL">Sales</option>
                    <option value="HR">Human Resource</option>
                    <option value="MR">Marketing</option>
                </select>

                <label for="regPos" id="regLabelPos">Position:</label>
                <input type="text" id="regPos" name="position" required placeholder="Your position in the company">

                <div class="radioRoles">
                    <input type="radio" name="role" value="employee" id="employee">
                    <label for="employee">Employee</label>
                    <input type="radio" name="role" value="admin" id="admin">
                    <label for="admin">Admin</label>
                </div>

                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I agree to the terms and conditions</label>

                <button type="submit">Register</button>
            </section>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Patrick's HTML Practice. All rights reserved.</p>
    </footer>
</body>

</html>
